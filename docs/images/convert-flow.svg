idth="1.4"/><text x="1087.5" y="643.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="700" fill="#1c2530" text-anchor="middle">低通截止</text><rect x="30" y="656" width="190" height="32" rx="3" fill="#ffffff" stroke="#d5dde8" stroke-width="1.4"/><text x="125.0" y="676.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="700" fill="#1a5fb4" text-anchor="middle">DSD64</text><rect x="220" y="656" width="265" height="32" rx="3" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.4"/><text x="352.5" y="676.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#1c2530" text-anchor="middle">2 822 400 Hz</text><rect x="485" y="656" width="265" height="32" rx="3" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.4"/><text x="617.5" y="676.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#1c2530" text-anchor="middle">352 800 Hz</text><rect x="750" y="656" width="235" height="32" rx="3" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.4"/><text x="867.5" y="676.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#1c2530" text-anchor="middle">88 200 Hz</text><rect x="985" y="656" width="205" height="32" rx="3" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.4"/><text x="1087.5" y="676.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#1c2530" text-anchor="middle">24 000 Hz</text><rect x="30" y="688" width="190" height="32" rx="3" fill="#ffffff" stroke="#d5dde8" stroke-width="1.4"/><text x="125.0" y="708.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="700" fill="#1a5fb4" text-anchor="middle">DSD128</text><rect x="220" y="688" width="265" height="32" rx="3" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.4"/><text x="352.5" y="708.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#1c2530" text-anchor="middle">5 644 800 Hz</text><rect x="485" y="688" width="265" height="32" rx="3" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.4"/><text x="617.5" y="708.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#1c2530" text-anchor="middle">705 600 Hz</text><rect x="750" y="688" width="235" height="32" rx="3" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.4"/><text x="867.5" y="708.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#1c2530" text-anchor="middle">176 400 Hz</text><rect x="985" y="688" width="205" height="32" rx="3" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.4"/><text x="1087.5" y="708.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#1c2530" text-anchor="middle">40 000 Hz</text><rect x="30" y="720" width="190" height="32" rx="3" fill="#ffffff" stroke="#d5dde8" stroke-width="1.4"/><text x="125.0" y="740.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="700" fill="#1a5fb4" text-anchor="middle">DSD256</text><rect x="220" y="720" width="265" height="32" rx="3" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.4"/><text x="352.5" y="740.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#1c2530" text-anchor="middle">11 289 600 Hz</text><rect x="485" y="720" width="265" height="32" rx="3" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.4"/><text x="617.5" y="740.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#1c2530" text-anchor="middle">1 411 200 Hz</text><rect x="750" y="720" width="235" height="32" rx="3" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.4"/><text x="867.5" y="740.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#1c2530" text-anchor="middle">352 800 Hz</text><rect x="985" y="720" width="205" height="32" rx="3" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.4"/><text x="1087.5" y="740.375" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#1c2530" text-anchor="middle">80 000 Hz</text><text x="30" y="772" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#5b6b7c" text-anchor="start" font-weight="400" style="">容器声明的 2.8224MHz 是 1-bit 流的比特率，ffmpeg 解码后输出 352.8kHz PCM（差 8 倍），必须用解码率查表；352.8kHz 远超 FLAC 上限，不先降采样会报 not supported。</text><text x="30" y="808" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" fill="#1c2530" text-anchor="start" font-weight="700" style="">校验阶段的数据流（分轨与直转共用 · verify.py）</text><rect x="30" y="820" width="330" height="92" rx="8" fill="#f7f2ea" stroke="#c9b79a" stroke-width="1.4"/><text x="195.0" y="862.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="middle">源音频</text><text x="195.0" y="879.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle">分轨：对应区段 / 直转：整文件</text><line x1="366" y1="866" x2="400" y2="866" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="406" y="820" width="330" height="92" rx="8" fill="#eef2f8" stroke="#c3cede" stroke-width="1.4"/><text x="571.0" y="862.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="middle">ffprobe</text><text x="571.0" y="879.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle">采样率 / 位深 / 声道数 / 解码器名</text><line x1="742" y1="866" x2="776" y2="866" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="782" y="820" width="368" height="92" rx="8" fill="#eef2f8" stroke="#c3cede" stroke-width="1.4"/><text x="966.0" y="862.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="middle">ffmpeg 解码为 s32le 裸 PCM</text><text x="966.0" y="879.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle">帧数 = 字节数 ÷ (4 × 声道数)  ·  MD5 逐字节比对</text><rect x="30" y="926" width="1160" height="40" rx="8" fill="#fff4d6" stroke="#d9a520" stroke-width="1.4"/><text x="610.0" y="950.725" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#8a6400" text-anchor="middle">⇒  无损  /  有损转换  /  参数被改动  /  校验未通过</text></svg>