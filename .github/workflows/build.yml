name: Build portable EXE

on:
  push:
    branches: [main]
    # 仅当源码/打包相关文件变动时才触发构建；纯文档（README/USAGE 等）改动不打包
    paths:
      - 'cue2flac/**'
      - 'gui.py'
      - 'dnd.py'
      - 'main.py'
      - 'tests/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Layout & GUI smoke tests
        shell: pwsh
        run: |
          # 折行算法（纯计算）+ GUI 布局冒烟（需 tkinter；无显示环境会自动跳过）
          # + 工作流 YAML 静态校验（防止 YAML 解析失败导致 CI 直接红）
          python -m pip install pytest pyyaml
          python -m pytest tests/test_layout.py tests/test_gui_smoke.py tests/test_workflow.py -q -rs --tb=short

      - name: Download ffmpeg (with ffprobe) for Windows
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -URI $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ff = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $fp = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ff.FullName ffmpeg.exe
          Copy-Item $fp.FullName ffprobe.exe
          echo "ffmpeg: $($ff.FullName)"
          ./ffmpeg.exe -version | Select-Object -First 1

      - name: Build onefile EXE (ffmpeg bundled)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --name cue2flac `
            --hidden-import cue2flac `
            --hidden-import cue2flac.cli `
            --hidden-import cue2flac.cue_parser `
            --hidden-import cue2flac.splitter `
            --hidden-import cue2flac.batch `
            --hidden-import cue2flac.convert `
            --hidden-import cue2flac.dsd `
            --hidden-import cue2flac.config `
            --hidden-import cue2flac.verify `
            --hidden-import cue2flac.layout `
            --hidden-import cue2flac.ffmpeg_provider `
            --hidden-import tkinter `
            --hidden-import dnd `
            --add-binary "ffmpeg.exe;ffmpeg" `
            --add-binary "ffprobe.exe;ffmpeg" `
            main.py
          echo "--- dist ---"
          ls dist

      - name: "Smoke test (multi-format split + per-format decoder check)"
        shell: pwsh
        run: |
          # 生成 3 秒静音立体声母带
          ./ffmpeg.exe -f lavfi -i anullsrc=r=44100:cl=stereo -t 3 -y master.wav

          # ① 目标格式必须全部具备「容器解析 + 解码」能力
          #    cue2flac 的分轨链路与格式无关：解码 → 按 INDEX 切段 → FLAC 编码，
          #    唯一与格式相关的是 ffmpeg 的容器解析与解码能力。APE / DSD 只有解码器、
          #    没有编码器，无法在 CI 内合成样本，故以能力可用性作为它们的准入门槛。
          #    用 `ffmpeg -h <kind>=<name>` 直接查内部注册表（比解析列表文本更可靠），
          #    并排除输出中的 "Unknown" 以确认目标确实存在。
          function Test-FfmpegHas($kind, $names) {
            foreach ($n in $names) {
              $probe = ./ffmpeg.exe -hide_banner -h "$kind=$n" 2>&1 | Out-String
              if (($LASTEXITCODE -eq 0) -and ($probe -notmatch 'Unknown')) { return $true }
            }
            return $false
          }

          # 打印相关条目便于排查（容器 / 解码器名称并非总与文件扩展名一致）
          Write-Host "---- 相关 demuxer ----"
          ((./ffmpeg.exe -hide_banner -demuxers 2>$null | Out-String) -split "`n") |
            Where-Object { $_ -match 'iff|ds|ape|flac|wav|pcm' } |
            ForEach-Object { Write-Host ("  " + $_.Trim()) }
          Write-Host "---- 相关 decoder ----"
          ((./ffmpeg.exe -hide_banner -decoders 2>$null | Out-String) -split "`n") |
            Where-Object { $_ -match 'ds|ape|flac|pcm_s16' } |
            ForEach-Object { Write-Host ("  " + $_.Trim()) }
          Write-Host "-------------------------"

          # 容器名与文件扩展名不一定对应：.dff(DSDIFF) 由 iff 解复用器处理（老版本叫 dsdiff）
          # hard=$false 表示「仅提示」：打包所用的 ffmpeg 构建是否内置 DSDIFF 属于第三方
          # 构建属性，真正决定 .dff 能否处理的是用户本机的 ffmpeg，故不因此判定 CI 失败。
          $req = @(
            @{ fmt = 'wav';  demux = @('wav');           dec = @('pcm_s16le');                  hard = $true },
            @{ fmt = 'flac'; demux = @('flac');          dec = @('flac');                       hard = $true },
            @{ fmt = 'ape';  demux = @('ape');           dec = @('ape');                        hard = $true },
            @{ fmt = 'dsf';  demux = @('dsf');           dec = @('dsd_lsbf', 'dsd_msbf');       hard = $true },
            @{ fmt = 'dff';  demux = @('iff', 'dsdiff'); dec = @('dsd_lsbf', 'dsd_msbf');       hard = $false }
          )
          foreach ($r in $req) {
            $hasDemux = Test-FfmpegHas 'demuxer' $r.demux
            $hasDec = Test-FfmpegHas 'decoder' $r.dec
            if (-not ($hasDemux -and $hasDec)) {
              $msg = "ffmpeg 缺少 $($r.fmt) 能力（容器: $($r.demux -join '/')，解码器: $($r.dec -join '/')）"
              if ($r.hard) {
                Write-Error $msg
                exit 1
              }
              Write-Host "WARN: $msg —— 该能力由用户本机 ffmpeg 决定，不影响本次打包"
              continue
            }
            Write-Host "format OK: $($r.fmt)"
          }

          function Split-Cue($audioFile, $label) {
            # 用数组拼装 CUE（避免 here-string 结束标记缩进问题）
            $cueLines = @(
              "FILE ""$audioFile"" WAVE",
              "  TRACK 01 AUDIO",
              "    TITLE ""TestTrack1""",
              "    PERFORMER ""SmokeTest""",
              "    INDEX 01 00:00:00",
              "  TRACK 02 AUDIO",
              "    TITLE ""TestTrack2""",
              "    PERFORMER ""SmokeTest""",
              "    INDEX 01 00:01:50"
            )
            Set-Content -Encoding ascii -Path test.cue -Value ($cueLines -join "`n")
            # 用打包好的 exe 执行分轨（控制台 exe，输出直接回显）
            $cuePath = (Resolve-Path test.cue).Path
            $runOut = ./dist/cue2flac.exe $cuePath -o "out_$label" --no-cover 2>&1 | Out-String
            Write-Host $runOut
            # 若 exe 产生了日志，打印出来便于排查
            $log = Join-Path dist cue2flac_cli.log
            if (Test-Path $log) { Write-Host "=== cue2flac_cli.log ==="; Get-Content $log }
            # 关键断言：源码必须按预期扩展名被解析（防止静默回退到其它同名文件而造成假通过）
            if ($runOut -notmatch [regex]::Escape($audioFile)) {
              Write-Error "${label}: 音频源解析异常，期望 $audioFile"
              exit 1
            }
            # 校验：必须产出两首非空 FLAC
            if (-not (Test-Path "out_$label")) {
              Write-Error "${label}: 输出目录未生成，分轨失败"
              exit 1
            }
            $files = Get-ChildItem "out_$label" -Recurse -Filter *.flac
            if ($files.Count -ne 2) {
              Write-Error "${label}: 期望生成 2 个 FLAC，实际 $($files.Count) 个"
              exit 1
            }
            foreach ($f in $files) {
              if ($f.Length -lt 1000) {
                Write-Error "${label}: FLAC 文件过小：$($f.Name) ($($f.Length) B)"
                exit 1
              }
            }
            Write-Host "$label smoke OK: 生成 2 个 FLAC"
          }

          # ② 能编码的格式做真实端到端分轨；ffmpeg 无对应编码器时跳过（解码器已在 ① 校验）
          $encoders = ./ffmpeg.exe -hide_banner -encoders 2>$null | Out-String
          $cases = @(
            @{ enc = 'pcm_s16le'; ext = 'wav'; label = 'wav' },
            @{ enc = 'flac';     ext = 'flac'; label = 'flac' },
            @{ enc = 'wavpack';  ext = 'wv';   label = 'wv'   },
            @{ enc = 'tta';      ext = 'tta';  label = 'tta'  }
          )
          foreach ($c in $cases) {
            if ($encoders -notmatch "\b$($c.enc)\b") {
              Write-Host "skip $($c.label): ffmpeg 无 $($c.enc) 编码器（仅解码器可用）"
              continue
            }
            $name = "master.$($c.ext)"
            ./ffmpeg.exe -y -i master.wav -c:a $c.enc $name
            if (-not (Test-Path $name)) {
              Write-Error "$($c.label): 未能生成 $name"
              exit 1
            }
            Split-Cue $name $c.label
          }

          Write-Host "multi-format smoke OK（wav/flac 等可编码格式已真实分轨；ape/dsf/dff 已验证解码器可用）"

      - name: "Smoke test (DSD split for dsf and dff, end-to-end)"
        shell: pwsh
        run: |
          # DSD 分轨是本项目最易出错的路径：解码采样率高达 352.8kHz（DSD64），
          # 远超 FLAC 编码器上限，必须先做「低通 + 抽取降采样」。
          # 这里用 Python 现场构造合法的 DSF / DFF 容器（ffmpeg 无 DSD 封装器），
          # 再用打包好的 exe 做真实分轨，断言输出为 88200Hz / 24bit 的 FLAC。
          #
          # 注意：不能用嵌套 @"..."@ here-string（结束标记必须顶格，
          # 在缩进块里必然报错），改用数组 -join 拼接。
          $pyLines = @(
            "import os, struct, subprocess, sys",
            "BLOCK = 4096",
            "RATE = 2822400",
            "def blocks(nbytes_per_ch, channels):",
            "    nb = (nbytes_per_ch + BLOCK - 1) // BLOCK",
            "    out = bytearray()",
            "    for b in range(nb):",
            "        for c in range(channels):",
            "            out += bytes([0x69 if ((b + c) % 2 == 0) else 0x96]) * BLOCK",
            "    return bytes(out)",
            "def plan(seconds):",
            "    nb = max(1, int(seconds * RATE) // (8 * BLOCK))",
            "    ts = nb * 8 * BLOCK",
            "    return ts, ts // 8, blocks(ts // 8, 2)",
            "def write_dsf(path, seconds=12.0):",
            "    ts, pcb, payload = plan(seconds)",
            "    fmt = struct.pack('<IIIIIIQI', 1, 0, 2, 2, RATE, 1, ts, BLOCK) + b'\x00' * 4",
            "    total = 12 + 16 + 12 + 52 + 12 + len(payload)",
            "    with open(path, 'wb') as f:",
            "        f.write(b'DSD ' + struct.pack('<Q', 28) + struct.pack('<QQ', total, 0))",
            "        f.write(b'fmt ' + struct.pack('<Q', 52) + fmt)",
            "        f.write(b'data' + struct.pack('<Q', len(payload) + 12) + payload)",
            "def write_dff(path, seconds=12.0):",
            "    ts, pcb, payload = plan(seconds)",
            "    def chunk(cid, data):",
            "        o = cid + struct.pack('>Q', len(data)) + data",
            "        return o + (b'\x00' if len(data) & 1 else b'')",
            "    fver = chunk(b'FVER', struct.pack('>I', 0x01050000))",
            "    fs = chunk(b'FS  ', struct.pack('>I', RATE))",
            "    chnl = chunk(b'CHNL', struct.pack('>H', 2) + struct.pack('<I', 1) + struct.pack('<I', 2))",
            "    cmpr = chunk(b'CMPR', b'DSD ')",
            "    prop = chunk(b'PROP', b'SND ' + fs + chnl + cmpr)",
            "    body = fver + prop + chunk(b'DSD ', payload)",
            "    with open(path, 'wb') as f:",
            "        f.write(b'FRM8' + struct.pack('>Q', len(body) + 4) + b'DSD ' + body)",
            "for ext, writer in (('dsf', write_dsf), ('dff', write_dff)):",
            "    writer('master.' + ext)",
            "    print('prepared', ext)",
            "print('DSD-PREP OK')"
          )
          $pyLines -join "`n" | Set-Content -Encoding UTF8 make_dsd.py
          $prep = python make_dsd.py 2>&1 | Out-String
          Write-Host $prep
          if ($prep -notmatch 'DSD-PREP OK') {
            Write-Error "DSD 样本构造失败"
            exit 1
          }

          foreach ($ext in @('dsf', 'dff')) {
            # 复用上一步的多格式 CUE 生成逻辑：每格式一个独立 CUE
            # 注意 PowerShell 里含冒号的字符串必须整体加引号，否则被当作
            # 哈希表键值分隔符；此处用格式化字符串避免嵌套引号。
            $fileLine = 'FILE "master.{0}" WAVE' -f $ext
            $cueLines = @(
              $fileLine,
              "  TRACK 01 AUDIO",
              '    TITLE "DSDTrack1"',
              "    INDEX 01 00:00:00",
              "  TRACK 02 AUDIO",
              '    TITLE "DSDTrack2"',
              "    INDEX 01 00:04:00",
              "  TRACK 03 AUDIO",
              '    TITLE "DSDTrack3"',
              "    INDEX 01 00:08:00"
            )
            Set-Content -Encoding ascii -Path "dsd_$ext.cue" -Value ($cueLines -join "`n")

            $runOut = ./dist/cue2flac.exe "dsd_$ext.cue" -o "out_dsd_$ext" --no-cover 2>&1 | Out-String
            Write-Host $runOut
            $files = Get-ChildItem "out_dsd_$ext" -Recurse -Filter *.flac -ErrorAction SilentlyContinue
            if (-not $files -or $files.Count -ne 3) {
              Write-Error "${ext}: 期望生成 3 个 FLAC，实际 $(@($files).Count) 个"
              exit 1
            }
            foreach ($f in $files) {
              # 必须被降采样到 88200Hz（若仍为 352800Hz 说明漏了降采样，
              # 而 352800Hz 会被 FLAC 编码器直接拒绝，报 "not supported"）
              $rate = (./ffmpeg/ffprobe.exe -v error -show_entries stream=sample_rate -of csv=p=0 $f.FullName)
              if ($rate.Trim() -ne '88200') {
                Write-Error "${ext}: 输出采样率应为 88200，实际 $($rate.Trim())"
                exit 1
              }
              # 位深必须是 24（s32 承载 24 位有效数据）
              $bits = (./ffmpeg/ffprobe.exe -v error -show_entries stream=bits_per_raw_sample -of csv=p=0 $f.FullName)
              if ($bits.Trim() -ne '24') {
                Write-Error "${ext}: 输出位深应为 24，实际 $($bits.Trim())"
                exit 1
              }
              if ($f.Length -lt 1000) {
                Write-Error "${ext}: FLAC 文件过小：$($f.Name) ($($f.Length) B)"
                exit 1
              }
            }
            Write-Host "${ext} DSD split OK: 3 个 88200Hz / 24bit FLAC"
          }
          Write-Host "DSD split smoke OK"

      - name: "Smoke test (direct convert without CUE)"
        shell: pwsh
        run: |
          # 不依赖 CUE 的直接转换：整轨音频 → FLAC
          # 关键断言：
          #  ① 位深必须保持（24bit 源转 FLAC 后仍是 24bit，而非被静默降为 16bit）；
          #  ② 采样率 / 声道数必须与源一致；
          #  ③ PCM 逐字节一致（源与输出各自解码为 s32le 后求 MD5）→ 实证无损。

          function Convert-And-Check($src, $label, $expectRate, $expectBits) {
            $out = "conv_$label"
            $runOut = ./dist/cue2flac.exe $src -o $out --no-cover 2>&1 | Out-String
            Write-Host $runOut
            if ($runOut -notmatch '直接转换汇总') {
              Write-Error "${label}: 未进入直接转换流程"
              exit 1
            }
            # 校验默认开启：输出必须给出逐项校验结果并判定为「无损」
            if ($runOut -notmatch '校验：采样率') {
              Write-Error "${label}: 未输出逐项校验结果"
              exit 1
            }
            if ($runOut -notmatch '（无损）') {
              Write-Error "${label}: 校验结论不是「无损」"
              exit 1
            }
            $flac = Get-ChildItem $out -Filter *.flac -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $flac) {
              Write-Error "${label}: 未生成 FLAC"
              exit 1
            }
            $info = ./ffprobe.exe -v error -select_streams a:0 `
              -show_entries stream=sample_rate,channels,bits_per_raw_sample `
              -of default=nw=1 $flac.FullName | Out-String
            Write-Host $info
            if ($info -notmatch "sample_rate=$expectRate") {
              Write-Error "${label}: 采样率不匹配，期望 $expectRate"
              exit 1
            }
            if ($info -notmatch "bits_per_raw_sample=$expectBits") {
              Write-Error "${label}: 位深不匹配，期望 $expectBits"
              exit 1
            }
            # 无损实证：源与输出各自解码为 s32le 裸 PCM，求 MD5 必须一致
            ./ffmpeg.exe -v error -i $src -f s32le -c:a pcm_s32le -y "$env:TEMP\src.pcm" 2>$null
            ./ffmpeg.exe -v error -i $flac.FullName -f s32le -c:a pcm_s32le -y "$env:TEMP\out.pcm" 2>$null
            $m1 = (Get-FileHash "$env:TEMP\src.pcm" -Algorithm MD5).Hash
            $m2 = (Get-FileHash "$env:TEMP\out.pcm" -Algorithm MD5).Hash
            if ($m1 -ne $m2) {
              Write-Error "${label}: PCM MD5 不一致（$m1 vs $m2），转换不是无损的"
              exit 1
            }
            Write-Host "direct convert OK: $label (rate=$expectRate bits=$expectBits lossless)"
          }

          # 16bit WAV
          ./ffmpeg.exe -f lavfi -i anullsrc=r=44100:cl=stereo -t 3 -y conv16.wav 2>$null
          Convert-And-Check "conv16.wav" "wav16" 44100 16

          # 24bit WAV（位深保持是重点）
          ./ffmpeg.exe -f lavfi -i anullsrc=r=48000:cl=stereo -t 3 -c:a pcm_s24le -y conv24.wav 2>$null
          Convert-And-Check "conv24.wav" "wav24" 48000 24

          # FLAC 源（流拷贝路径）
          ./ffmpeg.exe -y -i conv16.wav conv.flac 2>$null
          Convert-And-Check "conv.flac" "flac" 44100 16

          Write-Host "Direct-convert smoke OK"

      - name: "Smoke test (verify detects parameter changes)"
        shell: pwsh
        run: |
          # 校验能力冒烟：构造一个「参数被改动」的输出，确认程序能检出并提示。
          # 做法：把 44100 源重采样到 22050 作为「坏输出」，
          # 让校验逻辑比对源与它，断言必须报出采样率不一致。
          New-Item -ItemType Directory -Force verifycase | Out-Null
          ./ffmpeg.exe -f lavfi -i anullsrc=r=44100:cl=stereo -t 3 -y verifycase\src.wav 2>$null
          ./ffmpeg.exe -y -i verifycase\src.wav -ar 22050 -c:a flac verifycase\bad.flac 2>$null
          # 用 Python 直接调用内置校验模块，断言能检出参数改动。
          # 注意两点：
          # ① 不能用 @"..."@ 这种嵌套 here-string（结束标记必须顶格，
          #    在缩进块里必然报错），改用数组 -join 拼接；
          # ② 结果含中文，而 CI runner 的 stdout 编码是 cp1252，
          #    直接 print 会抛 UnicodeEncodeError。
          #    因此把结果重定向到 UTF-8 文件再由 PowerShell 读取。
          $pyLines = @(
            "import sys",
            "try:",
            "    sys.stdout.reconfigure(encoding='utf-8', errors='replace')",
            "except Exception:",
            "    pass",
            "sys.path.insert(0, '.')",
            "from cue2flac import verify as V",
            "from cue2flac.ffmpeg_provider import resolve_tool",
            "ff = resolve_tool('ffmpeg'); fp = resolve_tool('ffprobe')",
            "r = V.verify_whole_file('verifycase/src.wav', 'verifycase/bad.flac', ff, fp)",
            "print('status =', r.status)",
            "print('params_match =', r.params_match)",
            "for e in r.errors: print('ERR:', e)",
            "assert not r.params_match, 'parameter change not detected'",
            "assert r.status == u'\u53c2\u6570\u88ab\u6539\u52a8', 'wrong status: %s' % r.status",
            "assert any('sampling' in e or u'\u91c7\u6837\u7387' in e for e in r.errors), 'no rate diff reported'",
            "import subprocess",
            "subprocess.run([ff, '-y', '-i', 'verifycase/src.wav', '-c:a', 'flac', 'verifycase/good.flac'], check=True, capture_output=True)",
            "g = V.verify_whole_file('verifycase/src.wav', 'verifycase/good.flac', ff, fp)",
            "print('good status =', g.status)",
            "assert g.ok, 'good output failed: %s' % g.errors",
            "assert g.src_frames == g.out_frames, 'frame count mismatch'",
            "assert abs(g.src_duration - g.out_duration) < 1e-3, 'duration mismatch'",
            "print('VERIFY-DETECT OK')"
          )
          $pyLines -join "`n" | Set-Content -Encoding UTF8 verifycase\check.py
          $env:PYTHONIOENCODING = "utf-8"
          $out = python verifycase\check.py 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'VERIFY-DETECT OK') {
            Write-Error "校验能力冒烟未通过"
            exit 1
          }

      - name: Batch smoke test (scan directory, skip broken)
        shell: pwsh
        run: |
          # 构造一个含子目录、有效与损坏 CUE 的测试树
          New-Item -ItemType Directory -Force sub\A, sub\B | Out-Null
          ./ffmpeg.exe -f lavfi -i anullsrc=r=44100:cl=stereo -t 3 -y sub\A\audioA.wav 2>$null
          ./ffmpeg.exe -f lavfi -i anullsrc=r=44100:cl=stereo -t 3 -y sub\B\audioB.wav 2>$null
          @"
          FILE "audioA.wav" WAVE
            TRACK 01 AUDIO
              TITLE "SongA1"
              INDEX 01 00:00:00
            TRACK 02 AUDIO
              TITLE "SongA2"
              INDEX 01 00:01:50
          "@ | Set-Content -Encoding ascii sub\A\albumA.cue
          @"
          FILE "audioB.wav" WAVE
            TRACK 01 AUDIO
              TITLE "SongB1"
              INDEX 01 00:00:00
          "@ | Set-Content -Encoding ascii sub\B\albumB.cue
          # 损坏的 CUE：无 TRACK，应被跳过
          @"
          REM just a broken cue
          FILE "nope.wav" WAVE
          "@ | Set-Content -Encoding ascii sub\broken.cue

          # 批量扫描 sub 目录（递归），输出到 batchout
          ./dist/cue2flac.exe --dir sub -o batchout --no-cover
          # 若窗口化 exe 产生了日志，打印出来便于排查
          $log = Join-Path dist cue2flac_cli.log
          if (Test-Path $log) { Write-Host "=== cue2flac_cli.log ==="; Get-Content $log }

          # 校验：应成功处理 2 个（A、B），跳过 1 个（broken）
          $ok = 0
          if (Test-Path batchout) {
            $ok = (Get-ChildItem batchout -Directory).Count
          }
          if ($ok -ne 2) {
            Write-Error "批量处理期望成功 2 个专辑，实际 $ok 个"
            exit 1
          }
          # 统计所有生成的 FLAC：A 有 2 首，B 有 1 首，共 3 首
          $flacs = Get-ChildItem batchout -Recurse -Filter *.flac
          if ($flacs.Count -ne 3) {
            Write-Error "批量处理期望生成 3 个 FLAC，实际 $($flacs.Count) 个"
            exit 1
          }
          Write-Host "Batch smoke test OK: 成功 2 个专辑 / 跳过 1 个损坏 CUE / 共 3 首 FLAC"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cue2flac-portable
          path: dist/cue2flac.exe

      - name: Publish portable release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          gh release delete portable -y 2>$null
          git push origin :refs/tags/portable 2>$null
          gh release create portable dist/cue2flac.exe `
            --title "cue2flac 便携版（内嵌 ffmpeg）" `
            --notes "自动构建的单文件便携 exe，已内嵌 ffmpeg/ffprobe，双击即可使用，无需安装任何环境。" `
            --latest
