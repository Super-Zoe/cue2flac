name: Build portable EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Download ffmpeg (with ffprobe) for Windows
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -URI $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ff = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $fp = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ff.FullName ffmpeg.exe
          Copy-Item $fp.FullName ffprobe.exe
          echo "ffmpeg: $($ff.FullName)"
          ./ffmpeg.exe -version | Select-Object -First 1

      - name: Build onefile EXE (ffmpeg bundled)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --name cue2flac --windowed `
            --hidden-import cue2flac `
            --hidden-import cue2flac.cli `
            --hidden-import cue2flac.cue_parser `
            --hidden-import cue2flac.splitter `
            --hidden-import cue2flac.ffmpeg_provider `
            --hidden-import tkinter `
            --add-binary "ffmpeg.exe;ffmpeg" `
            --add-binary "ffprobe.exe;ffmpeg" `
            main.py
          echo "--- dist ---"
          ls dist

      - name: Smoke test (CLI help)
        shell: pwsh
        run: |
          ./dist/cue2flac.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cue2flac-portable
          path: dist/cue2flac.exe

      - name: Publish portable release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          gh release delete portable -y 2>$null
          git push origin :refs/tags/portable 2>$null
          gh release create portable dist/cue2flac.exe `
            --title "cue2flac 便携版（内嵌 ffmpeg）" `
            --notes "自动构建的单文件便携 exe，已内嵌 ffmpeg/ffprobe，双击即可使用，无需安装任何环境。" `
            --latest
