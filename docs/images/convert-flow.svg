<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1000" viewBox="0 0 1220 1000"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/></marker></defs><rect width="1220" height="1000" fill="#ffffff"/><text x="610.0" y="30" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#1c2530" text-anchor="middle">cue2flac 转换关系（数据 / 格式在各阶段的转换）</text><text x="30" y="44" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#1c2530" text-anchor="start" font-weight="700" style="">PCM 系无损源（WAV / APE / WavPack / TTA / TAK / ALAC / AIFF / M4A）</text><rect x="30" y="58" width="196" height="78" rx="8" fill="#f7f2ea" stroke="#c9b79a" stroke-width="1.4"/><text x="128.0" y="93.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="middle">源文件</text><text x="128.0" y="110.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle">.wav / .ape 等</text><rect x="270" y="58" width="196" height="78" rx="8" fill="#eef2f8" stroke="#c3cede" stroke-width="1.4"/><text x="368.0" y="93.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="middle">解码</text><text x="368.0" y="110.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle">ffmpeg → s16/s32 PCM</text><line x1="230" y1="97" x2="264" y2="97" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="510" y="58" width="196" height="78" rx="8" fill="#eef2f8" stroke="#c3cede" stroke-width="1.4"/><text x="608.0" y="93.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="middle">切段 / 不切段</text><text x="608.0" y="110.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle">分轨：按 INDEX 01 · 直转：整轨不切</text><line x1="470" y1="97" x2="504" y2="97" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="750" y="58" width="196" height="78" rx="8" fill="#eef4ff" stroke="#1a5fb4" stroke-width="1.4"/><text x="848.0" y="93.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="middle">FLAC 编码</text><text x="848.0" y="110.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle">s16 或 s32</text><line x1="710" y1="97" x2="744" y2="97" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="990" y="58" width="196" height="78" rx="8" fill="#e8f6ec" stroke="#2a9d3f" stroke-width="1.4"/><text x="1088.0" y="93.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="middle">输出</text><text x="1088.0" y="110.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle">NN. 标题.flac</text><line x1="950" y1="97" x2="984" y2="97" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="148" width="1160" height="40" rx="8" fill="#e8f6ec" stroke="#2a9d3f" stroke-width="1.4"/><text x="610.0" y="172.55" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#2a9d3f" text-anchor="middle">采样率 / 位深 / 声道数 / 帧数 / 时长 / PCM 全部不变  ⇒  逐样本无损（24bit 源用 s32 承载，bits_per_raw_sample 仍记 24）</text><text x="30" y="232" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#1c2530" text-anchor="start" font-weight="700" style="">FLAC 源（.flac）</text><rect x="30" y="246" width="240" height="78" rx="8" fill="#f7f2ea" stroke="#c9b79a" stroke-width="1.4"/><text x="150.0" y="281.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="middle">源文件</text><text x="150.0" y="298.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle">.flac</text><line x1="276" y1="285" x2="320" y2="285" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="326" y="246" width="420" height="78" rx="8" fill="#eef4ff" stroke="#1a5fb4" stroke-width="1.4"/><text x="536.0" y="281.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#1a5fb4" text-anchor="middle">-c:a copy（流拷贝，不重新编码）</text><text x="536.0" y="298.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle">+ 显式 -ar &lt;源采样率&gt;：流拷贝时 ffmpeg 不自动填充流参数</text><line x1="752" y1="285" x2="796" y2="285" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="802" y="246" width="316" height="78" rx="8" fill="#e8f6ec" stroke="#2a9d3f" stroke-width="1.4"/><text x="960.0" y="281.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#2a9d3f" text-anchor="middle">输出</text><text x="960.0" y="298.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle">源名.flac</text><rect x="30" y="336" width="1160" height="40" rx="8" fill="#e8f6ec" stroke="#2a9d3f" stroke-width="1.4"/><text x="610.0" y="360.55" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#2a9d3f" text-anchor="middle">音频数据字节级等价（仅容器标签可能被重写）</text><text x="30" y="420" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#1c2530" text-anchor="start" font-weight="700" style="">DSD 源（.dsf / .dff）</text><rect x="30" y="434" width="196" height="78" rx="8" fill="#f7f2ea" stroke="#c9b79a" stroke-width="1.4"/><text x="128.0" y="469.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="middle">源文件</text><text x="128.0" y="486.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle">.dsf / .dff</text><rect x="270" y="434" width="196" height="78" rx="8" fill="#eef2f8" stroke="#c3cede" stroke-width="1.4"/><text x="368.0" y="469.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="middle">DSD 解码</text><text x="368.0" y="486.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle">352800 Hz（DSD64）</text><line x1="230" y1="473" x2="264" y2="473" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="510" y="434" width="196" height="78" rx="8" fill="#fdecea" stroke="#d9534f" stroke-width="1.4"/><text x="608.0" y="469.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="middle">低通 + 降采样</text><text x="608.0" y="486.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle">lowpass 24kHz · soxr → 88200 Hz</text><line x1="470" y1="473" x2="504" y2="473" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="750" y="434" width="196" height="78" rx="8" fill="#eef4ff" stroke="#1a5fb4" stroke-width="1.4"/><text x="848.0" y="469.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" text-anchor="middle">FLAC 编码</text><text x="848.0" y="486.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5b6b7c" text-anchor="middle">s32</text><line x1="710" y1="473" x2="744" y2="473" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="990" y="434" width="196" height="78" rx="8" fill="#fdecea" stroke="#d9534f" stroke-width="1.4"/><text x="1088.0" y="469.0" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" font-weight="700" fill="#1c2530" 